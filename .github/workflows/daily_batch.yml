# 평일 1회: 공시실 수집 → data/latest.json 생성 → 커밋 → GitHub Pages 자동 반영
# 스위치: config/live.json 의 live_data=true (또는 저장소 변수 LIVE_DATA=true) 일 때만 실행
# 기본: 기준시점 조회(기준일+기간 시작일만). 1Y·3Y·5Y는 공시 수익률 사용
# 구간 이력 적재(선택): config/live.json 의 backfill.start/end 를 채워 커밋하면 그 구간을 1회 적재
name: daily-nav-batch

on:
  schedule:
    - cron: "13 22 * * 0-4"       # KST 월~금 07:13 (본 실행) → 당일 기준가(전 영업일 시장 반영). 공시 반영 시각 확인 필요
    - cron: "37 1 * * 1-5"        # KST 월~금 10:37 (보완 실행) → 아침에 미공시·일부 공시면 다시 시도, 변경 없으면 커밋 안 함
    - cron: "37 3 * * 1-5"        # KST 월~금 12:37 (보완 실행 2) → 일부 보험사 공시가 늦는 날 대비
    - cron: "37 6 * * 1-5"        # KST 월~금 15:37 (보완 실행 3)
  push:
    branches: [main]
    paths: ["config/live.json"]   # 백필 요청
  workflow_dispatch:
    inputs:
      backfill_start:
        description: "과거 이력 적재 시작일 (YYYY-MM-DD, 비우면 직전 영업일 1일치)"
        required: false
      backfill_end:
        description: "과거 이력 적재 종료일 (YYYY-MM-DD)"
        required: false

permissions:
  contents: write

concurrency:
  group: nav-batch-v3
  cancel-in-progress: false

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      KLIA_CONFIG: scripts/klia_request.json
      KLIA_RAW_DIR: data/raw
    steps:
      - uses: actions/checkout@v5

      - name: 스위치·백필 구간 확인
        id: cfg
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          c = json.load(open("config/live.json", encoding="utf-8"))
          live = c.get("live_data") is True or os.environ.get("VAR_LIVE") == "true"
          ev = os.environ["EV"]
          s, e = os.environ.get("IN_S", ""), os.environ.get("IN_E", "")
          if ev == "push":
              s, e = c.get("backfill", {}).get("start", ""), c.get("backfill", {}).get("end", "")
          print(f"live={'true' if live else 'false'}")
          print(f"start={s}"); print(f"end={e}")
          EOF
          cat "$GITHUB_OUTPUT"
        env:
          VAR_LIVE: ${{ vars.LIVE_DATA }}
          EV: ${{ github.event_name }}
          IN_S: ${{ inputs.backfill_start }}
          IN_E: ${{ inputs.backfill_end }}

      - uses: actions/setup-python@v6
        if: steps.cfg.outputs.live == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - if: steps.cfg.outputs.live == 'true'
        run: pip install -r requirements.txt

      - name: 공시실 수집 (백필은 월 단위로 나눠 매월 커밋 → 중단돼도 진행분 보존·재개)
        if: steps.cfg.outputs.live == 'true'
        run: |
          git config user.name "nav-batch"
          git config user.email "nav-batch@users.noreply.github.com"
          save() {
            git add -A data/raw
            git diff --cached --quiet && return 0
            git commit -qm "data: 이력 적재 $1"
            git pull -q --rebase origin main && git push -q
          }
          S="${{ steps.cfg.outputs.start }}"; E="${{ steps.cfg.outputs.end }}"
          if [ -n "$S" ] && [ -n "$E" ]; then
            python3 -c "
          import sys; from datetime import date, timedelta
          s, e = date.fromisoformat(sys.argv[1]), date.fromisoformat(sys.argv[2])
          while s <= e:
              m_end = (s.replace(day=28) + timedelta(days=4)).replace(day=1) - timedelta(days=1)
              print(s, min(m_end, e)); s = m_end + timedelta(days=1)
          " "$S" "$E" > /tmp/chunks.txt
            cat /tmp/chunks.txt
            while read cs ce; do
              echo "=== 구간 $cs ~ $ce ==="
              python scripts/scrape_klia.py --backfill "$cs" "$ce" --skip-existing || echo "[경고] 구간 $cs~$ce 일부 실패"
              save "$cs~$ce"
            done < /tmp/chunks.txt
          else
            # 일 배치: 기준일 + 기간 시작일(1D·1W·1M·3M·6M·YTD) 기준가만 조회, 14개월 지난 원본 정리
            python scripts/scrape_klia.py --anchors --prune-months 14
          fi

      - name: 시장 지표 (국고채 금리·원/달러, 한국은행 ECOS · 키 없으면 건너뜀)
        if: steps.cfg.outputs.live == 'true'
        continue-on-error: true
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: python scripts/fetch_indicators.py

      - name: 주요 지수 (코스피, 공공데이터 API · 키 없으면 건너뜀)
        if: steps.cfg.outputs.live == 'true'
        continue-on-error: true
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python scripts/fetch_market.py

      - name: latest.json 생성·점검
        if: steps.cfg.outputs.live == 'true'
        run: |
          python scripts/build_latest.py data/raw -o data/latest.json
          python scripts/check_latest.py data/latest.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 커밋 (Pages 자동 반영)
        if: always() && steps.cfg.outputs.live == 'true'
        run: |
          git config user.name "nav-batch"
          git config user.email "nav-batch@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "data: 기준가 배치 $(TZ=Asia/Seoul date +%F) [${{ github.event_name }}]"
          git pull --rebase origin main
          git push
