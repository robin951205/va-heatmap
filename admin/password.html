<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>비밀번호 설정 · 변액보험 펀드 히트맵 (검증계)</title>
<link rel="stylesheet" href="/admin/admin.css"></head><body class="center">
<form class="card" id="f">
  <h1 id="ttl">비밀번호 설정</h1>
  <p class="muted" id="lead">앞으로 검증계는 <b>사번 + 본인 비밀번호</b>로 로그인합니다.</p>
  <input type="text" name="username" id="un" autocomplete="username" hidden>
  <label id="curW">현재 비밀번호<input name="current" type="password" maxlength="64" autocomplete="current-password"></label>
  <label>새 비밀번호<input name="password" type="password" required minlength="10" maxlength="64" autocomplete="new-password"></label>
  <label>새 비밀번호 확인<input name="password2" type="password" required maxlength="64" autocomplete="new-password"></label>
  <p class="muted small">10자 이상 · 영문과 숫자 포함 · 사번 사용 불가</p>
  <button type="submit">저장</button>
  <p class="err" id="err"></p>
  <p class="muted small"><a href="#" id="out">로그아웃</a></p>
</form>
<script>
fetch("/api/me").then(r=>r.json()).then(d=>{ const a=d.admin; if(!a){ location.href="/admin/login"; return; }
  un.value=a.empno;
  if(a.must_change){ ttl.textContent="비밀번호 정하기"; lead.innerHTML=`${a.name}님, 처음 로그인하셨습니다. 앞으로 사용할 <b>본인 비밀번호</b>를 정해 주세요.`; curW.hidden=true; }
  else { ttl.textContent="비밀번호 변경"; }
});
f.onsubmit=async e=>{ e.preventDefault(); err.textContent="";
  const v=Object.fromEntries(new FormData(f)); if(v.password!==v.password2){ err.textContent="새 비밀번호가 서로 다릅니다."; return; }
  const r=await fetch("/api/password",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({current:v.current,password:v.password})});
  const d=await r.json(); if(!r.ok){ err.textContent=d.error||"저장 실패"; return; }
  alert(d.message); location.href="/";
};
out.onclick=async e=>{ e.preventDefault(); await fetch("/api/logout",{method:"POST",headers:{"content-type":"application/json"},body:"{}"}); location.href="/admin/login"; };
</script></body></html>
