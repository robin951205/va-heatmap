<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>검증계 로그인 · 변액보험 펀드 히트맵</title>
<link rel="stylesheet" href="/admin/admin.css"></head><body class="center">
<form class="card" id="f" >
  <h1>검증계 로그인</h1>
  <p class="muted">관리자로 승인된 사용자만 접속할 수 있습니다.</p>
  <label>사번<input name="empno" required maxlength="20" autocapitalize="characters" autocomplete="username"></label>
  <label>비밀번호<input name="password" type="password" required maxlength="64" autocomplete="current-password" placeholder="처음이면 받은 임시 접속코드"></label>
  <button type="submit">로그인</button>
  <p class="err" id="err"></p>
  <p class="muted small">처음 로그인할 때는 마스터 관리자에게 받은 <b>임시 접속코드</b>를 비밀번호 칸에 넣으세요. 이어서 본인 비밀번호를 정하게 됩니다.<br>비밀번호를 잊으면 마스터 관리자에게 초기화를 요청하세요.</p>
</form>
<script>
f.onsubmit=async e=>{e.preventDefault(); err.textContent="";
  const r=await fetch("/api/login",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(Object.fromEntries(new FormData(f)))});
  const d=await r.json(); if(!r.ok){err.textContent=d.error||"로그인 실패";return;}
  if(d.must_change){ location.href="/admin/password"; return; }
  const n=new URLSearchParams(location.search).get("next"); location.href=(n&&n.startsWith("/")&&!n.startsWith("//"))?n:"/";};
</script></body></html>
